<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Claudony envelope -->
  <rect x="40" y="30" width="600" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="56" font-size="13" fill="#94a3b8" font-weight="500">claudony fleet manager</text>

  <!-- Eidos -->
  <rect x="80" y="100" width="160" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="160" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#0c4a6e">eidos</text>
  <text x="160" y="156" text-anchor="middle" font-size="11" fill="#64748b">knowledge service</text>

  <!-- Engine -->
  <rect x="260" y="100" width="160" height="80" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="340" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#78350f">engine</text>
  <text x="340" y="156" text-anchor="middle" font-size="11" fill="#64748b">execution runtime</text>

  <!-- LLM App -->
  <rect x="440" y="100" width="160" height="80" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="520" y="136" text-anchor="middle" font-size="15" font-weight="600" fill="#14532d">my-llm</text>
  <text x="520" y="156" text-anchor="middle" font-size="11" fill="#64748b">your LLM app</text>

  <!-- Dependency arrows -->
  <line x1="240" y1="140" x2="258" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="140" x2="438" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Labels on arrows -->
  <text x="249" y="132" text-anchor="middle" font-size="9" fill="#94a3b8">depends on</text>
  <text x="429" y="132" text-anchor="middle" font-size="9" fill="#94a3b8">depends on</text>

  <!-- Reconciliation box -->
  <rect x="140" y="240" width="400" height="70" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="340" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#4c1d95">reconciliation loop</text>
  <text x="340" y="292" text-anchor="middle" font-size="11" fill="#64748b">compile  ·  plan  ·  provision  ·  verify  ·  repeat</text>

  <!-- Arrows from recon to services -->
  <line x1="220" y1="240" x2="180" y2="182" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="340" y1="240" x2="340" y2="182" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="460" y1="240" x2="500" y2="182" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Deploy order annotation -->
  <text x="160" y="210" text-anchor="middle" font-size="11" font-weight="500" fill="#7c3aed">1st</text>
  <text x="340" y="210" text-anchor="middle" font-size="11" font-weight="500" fill="#7c3aed">2nd</text>
  <text x="520" y="210" text-anchor="middle" font-size="11" font-weight="500" fill="#7c3aed">3rd</text>
</svg>
