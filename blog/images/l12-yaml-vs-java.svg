<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
  </defs>

  <rect width="700" height="280" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Topology Levels: YAML-First vs Java SPI</text>

  <!-- YAML-first column -->
  <rect x="30" y="50" width="300" height="200" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="180" y="72" text-anchor="middle" font-weight="700" fill="#166534" font-size="14">YAML-First (L01–L14)</text>

  <text x="50" y="100" fill="#334155" font-size="12">Edit YAML</text>
  <line x1="108" y1="96" x2="138" y2="96" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="143" y="100" fill="#334155" font-size="12">Redeploy topology</text>
  <line x1="268" y1="96" x2="298" y2="96" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="303" y="100" fill="#16a34a" font-weight="600" font-size="12">✓</text>

  <text x="50" y="130" fill="#64748b" font-size="11">Seconds to iterate</text>
  <text x="50" y="148" fill="#64748b" font-size="11">No compile cycle</text>
  <text x="50" y="166" fill="#64748b" font-size="11">LLM assistants generate YAML reliably</text>
  <text x="50" y="184" fill="#64748b" font-size="11">Ops teams can modify without developers</text>

  <text x="50" y="212" fill="#475569" font-size="12" font-weight="600">Levels: 01 02 03 04 05 06 07 08 09 10 14</text>
  <text x="50" y="232" fill="#16a34a" font-size="11">Framework Java handles everything</text>

  <!-- Java SPI column -->
  <rect x="370" y="50" width="300" height="200" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="520" y="72" text-anchor="middle" font-weight="700" fill="#991b1b" font-size="14">Per-Level Java (L12)</text>

  <text x="390" y="100" fill="#334155" font-size="12">Edit Java</text>
  <line x1="445" y1="96" x2="458" y2="96" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="463" y="100" fill="#334155" font-size="12">Compile</text>
  <line x1="510" y1="96" x2="523" y2="96" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="528" y="100" fill="#334155" font-size="12">Test</text>
  <line x1="555" y1="96" x2="568" y2="96" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="573" y="100" fill="#334155" font-size="12">Build</text>
  <line x1="600" y1="96" x2="613" y2="96" stroke="#475569" stroke-width="1" marker-end="url(#arr)"/>
  <text x="618" y="100" fill="#334155" font-size="12">Deploy</text>
  <line x1="657" y1="96" x2="658" y2="96" stroke="#475569" stroke-width="1"/>
  <text x="660" y="100" fill="#dc2626" font-weight="600" font-size="12">✓</text>

  <text x="390" y="130" fill="#64748b" font-size="11">Minutes to iterate</text>
  <text x="390" y="148" fill="#64748b" font-size="11">Full release cycle per change</text>
  <text x="390" y="166" fill="#64748b" font-size="11">Requires SPI knowledge</text>
  <text x="390" y="184" fill="#64748b" font-size="11">Developer-only changes</text>

  <text x="390" y="212" fill="#475569" font-size="12" font-weight="600">Level: 12 (only)</text>
  <text x="390" y="232" fill="#dc2626" font-size="11">AdhocLlmDeployerRecompiler required</text>
</svg>
