<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <rect width="860" height="440" fill="#0f172a" rx="8"/>

  <text x="430" y="30" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">From Topology Declaration to Runtime Proof</text>

  <!-- Left: YAML declaration -->
  <rect x="30" y="55" width="240" height="180" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="150" y="78" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">YAML Declaration</text>

  <text x="50" y="100" fill="#7dd3fc" font-size="10" font-family="monospace">nodes:</text>
  <text x="60" y="116" fill="#94a3b8" font-size="10" font-family="monospace">platform:</text>
  <text x="70" y="130" fill="#64748b" font-size="9" font-family="monospace">role: platform</text>
  <text x="70" y="143" fill="#64748b" font-size="9" font-family="monospace">llm.capability: fast</text>
  <text x="60" y="162" fill="#94a3b8" font-size="10" font-family="monospace">ledger:</text>
  <text x="70" y="176" fill="#64748b" font-size="9" font-family="monospace">role: ledger</text>
  <text x="60" y="195" fill="#94a3b8" font-size="10" font-family="monospace">qhorus:</text>
  <text x="70" y="209" fill="#64748b" font-size="9" font-family="monospace">role: qhorus</text>
  <text x="70" y="222" fill="#64748b" font-size="9" font-family="monospace">dependsOn: [platform, ledger]</text>

  <!-- Arrow 1 -->
  <line x1="275" y1="145" x2="310" y2="145" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="293" y="138" text-anchor="middle" fill="#64748b" font-size="9">compile</text>

  <!-- Middle: Compiled graph -->
  <rect x="315" y="55" width="220" height="180" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="425" y="78" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="500">Compiled Graph</text>

  <rect x="370" y="92" width="100" height="28" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="420" y="110" text-anchor="middle" fill="#93c5fd" font-size="11">platform</text>

  <rect x="335" y="140" width="80" height="28" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="375" y="158" text-anchor="middle" fill="#93c5fd" font-size="11">ledger</text>

  <rect x="435" y="140" width="80" height="28" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="475" y="158" text-anchor="middle" fill="#93c5fd" font-size="11">qhorus</text>

  <line x1="395" y1="120" x2="375" y2="138" stroke="#3b82f6" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="445" y1="120" x2="475" y2="138" stroke="#3b82f6" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="417" y1="154" x2="433" y2="154" stroke="#3b82f6" stroke-width="1" marker-end="url(#arr)"/>

  <text x="425" y="195" text-anchor="middle" fill="#22c55e" font-size="10">3 nodes, 3 deps</text>
  <text x="425" y="210" text-anchor="middle" fill="#22c55e" font-size="10">platform → ledger → qhorus</text>
  <text x="425" y="225" text-anchor="middle" fill="#64748b" font-size="9">compilation + reconciliation tests</text>

  <!-- Arrow 2 -->
  <line x1="540" y1="145" x2="575" y2="145" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="558" y="138" text-anchor="middle" fill="#64748b" font-size="9">deploy</text>

  <!-- Right: Runtime proof -->
  <rect x="580" y="55" width="250" height="180" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="705" y="78" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="500">Runtime Proof</text>

  <text x="600" y="100" fill="#86efac" font-size="10">1. Health UP</text>
  <text x="620" y="115" fill="#64748b" font-size="9">GET /q/health/ready → 200</text>
  <text x="600" y="135" fill="#86efac" font-size="10">2. Application persists</text>
  <text x="620" y="150" fill="#64748b" font-size="9">POST /api/ops/applications → 200</text>
  <text x="620" y="163" fill="#64748b" font-size="9">GET → incident-mgmt found</text>
  <text x="600" y="183" fill="#86efac" font-size="10">3. Channel round-trip</text>
  <text x="620" y="198" fill="#64748b" font-size="9">POST /api/channels → incident-channel</text>
  <text x="620" y="211" fill="#64748b" font-size="9">POST message → COMMAND delivered</text>
  <text x="620" y="224" fill="#64748b" font-size="9">GET messages → round-trip verified</text>

  <!-- Bottom: dimension progression -->
  <line x1="30" y1="270" x2="830" y2="270" stroke="#334155" stroke-width="1"/>
  <text x="430" y="295" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">Test Dimensions — Cumulative by Level</text>

  <!-- Level boxes -->
  <rect x="40" y="315" width="140" height="100" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="110" y="336" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Level 01</text>
  <text x="110" y="356" text-anchor="middle" fill="#22c55e" font-size="10">Deploy</text>
  <text x="110" y="372" text-anchor="middle" fill="#22c55e" font-size="10">LLM</text>
  <text x="110" y="400" text-anchor="middle" fill="#64748b" font-size="9">1 node</text>

  <rect x="200" y="315" width="140" height="100" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="270" y="336" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Level 02</text>
  <text x="270" y="356" text-anchor="middle" fill="#22c55e" font-size="10">+ Platform</text>
  <text x="270" y="372" text-anchor="middle" fill="#22c55e" font-size="10">+ Audit</text>
  <text x="270" y="400" text-anchor="middle" fill="#64748b" font-size="9">2 nodes</text>

  <rect x="360" y="315" width="140" height="100" rx="5" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="336" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="600">Level 03</text>
  <text x="430" y="356" text-anchor="middle" fill="#22c55e" font-size="10">+ Channels</text>
  <text x="430" y="372" text-anchor="middle" fill="#22c55e" font-size="10">+ State Lookup</text>
  <text x="430" y="400" text-anchor="middle" fill="#64748b" font-size="9">3 nodes</text>

  <rect x="520" y="315" width="140" height="100" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="590" y="336" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">Level 04+</text>
  <text x="590" y="356" text-anchor="middle" fill="#94a3b8" font-size="10">+ Fleet</text>
  <text x="590" y="372" text-anchor="middle" fill="#94a3b8" font-size="10">+ Drift</text>
  <text x="590" y="388" text-anchor="middle" fill="#94a3b8" font-size="10">+ Lifecycle</text>
  <text x="590" y="400" text-anchor="middle" fill="#64748b" font-size="9">...</text>

  <rect x="680" y="315" width="150" height="100" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="755" y="336" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">Scaffold UI</text>
  <text x="755" y="358" text-anchor="middle" fill="#94a3b8" font-size="10">Same dimensions</text>
  <text x="755" y="374" text-anchor="middle" fill="#94a3b8" font-size="10">YAML-driven</text>
  <text x="755" y="390" text-anchor="middle" fill="#94a3b8" font-size="10">Visual feedback</text>
  <text x="755" y="406" text-anchor="middle" fill="#64748b" font-size="9">interactive tutorial</text>
</svg>
